<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Left empty on purpose: dx fills this from [web.app] title in
       Dioxus.toml. Putting text here as well produces a doubled title. -->
  <title></title>
  <meta name="description" content="Software engineer. Cornell CS. Building things for the web." />
  <meta name="author" content="John J. Park" />
  <!-- Served verbatim from public/, so it is present on first paint rather
       than injected at hydration (which leaves a /favicon.ico 404 behind). -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="canonical" href="https://johnjpark.com/" />
  <meta name="theme-color" content="#fbfaf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12120f" media="(prefers-color-scheme: dark)" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://johnjpark.com/" />
  <meta property="og:title" content="John J. Park — Software Engineer" />
  <meta property="og:description" content="Software engineer. Cornell CS. Building things for the web." />
  <meta name="twitter:card" content="summary" />

  <!--
    Applies the saved theme before first paint so a dark-mode visitor never
    sees a white flash. Must stay inline and synchronous to do that.
  -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) { }
  </script>
</head>

<body>
  <div id="main"></div>
</body>

</html>
