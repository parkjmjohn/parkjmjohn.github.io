[application]

[web.app]
# Served from the domain root (johnjpark.com via CNAME), so no base_path.
title = "John J. Park — Software Engineer"

[web.watcher]
reload_html = true
watch_path = ["src", "assets", "index.html"]

# Optimise the wasm for size rather than speed. Nothing on this page is
# compute-bound, so bytes over the wire is the only metric that matters.
[web.wasm_opt]
level = "z"
