name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Build
        run: dx bundle --platform web --release

      - name: Stage site
        run: |
          # dx writes the servable site under target/dx/<app>/release/web/public
          mkdir -p dist
          cp -r target/dx/portfolio/release/web/public/. dist/
          # Custom domain, and stop Pages running the output through Jekyll.
          cp CNAME dist/CNAME
          touch dist/.nojekyll
          # GitHub Pages serves 404.html for unknown paths; reuse index so
          # deep links still boot the app.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
